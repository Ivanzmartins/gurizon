
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Em construção</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        main {
            text-align: center;
            padding: 40px 20px;
        }

        h1 {
            font-size: clamp(2rem, 6vw, 3.5rem);
            font-weight: 700;
            letter-spacing: -1px;
            margin-bottom: 16px;
        }

        p {
            font-size: 1.1rem;
            color: #777;
        }

        .line {
            width: 60px;
            height: 4px;
            background: #2563eb;
            margin: 24px auto 0;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <main>
        <h1>Em construção</h1>
        <p>Estamos preparando algo novo.</p>
        <div class="line"></div>
    </main>
</body>
</html>
